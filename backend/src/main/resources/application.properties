spring.application.name=customer-churn-backend

# MySQL Configuration
# MySQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/CUSTOMER_CHURN_OPS}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# Snowflake connection
snowflake.account=MR79468.ap-southeast-7.aws
snowflake.warehouse=CHURN_WH_XS
snowflake.database=CUSTOMER_CHURN_DB
snowflake.schema=ANALYTICS
snowflake.role=SYSADMIN

snowflake.username=${SNOWFLAKE_USERNAME}
snowflake.password=${SNOWFLAKE_PASSWORD}